name: JudgeBench CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx fastapi uvicorn pydantic

      - name: Lint with ruff
        run: ruff check .

      - name: Run Pytest test suite
        run: |
          export PYTHONPATH=.
          pytest -v tests/
